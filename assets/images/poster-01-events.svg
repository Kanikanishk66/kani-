<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1280" width="100%" height="100%">
  <defs>
    <radialGradient id="p1Grad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#19152b" />
      <stop offset="60%" stop-color="#0b0914" />
      <stop offset="100%" stop-color="#040307" />
    </radialGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <rect width="960" height="1280" fill="url(#p1Grad)" />

  <!-- Outer Trim & Swiss Crosses -->
  <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="1">
    <path d="M40,50 L60,50 M50,40 L50,60" />
    <path d="M900,50 L920,50 M910,40 L910,60" />
    <path d="M40,1230 L60,1230 M50,1220 L50,1240" />
    <path d="M900,1230 L920,1230 M910,1220 L910,1240" />
    <line x1="50" y1="180" x2="910" y2="180" stroke-dasharray="3,3" />
    <line x1="50" y1="960" x2="910" y2="960" stroke-dasharray="3,3" />
  </g>

  <!-- Typography Top Row -->
  <g fill="#94a3b8" font-family="'Space Grotesk', monospace" font-size="12" letter-spacing="3">
    <text x="50" y="80">01 // CULTURAL EVENT</text>
    <text x="480" y="80" text-anchor="middle">INTERNATIONAL SOUND &amp; LIGHT FESTIVAL</text>
    <text x="910" y="80" text-anchor="end">OCTOBER 2026</text>
  </g>

  <!-- Main Headline Typography -->
  <g font-family="'Space Grotesk', sans-serif" font-weight="900">
    <text x="50" y="160" font-size="96" fill="#ffffff" letter-spacing="-3">RESONANCE</text>
  </g>

  <!-- Visual Centerpiece: Harmonic Waveform Rings -->
  <g transform="translate(480, 560)">
    <circle cx="0" cy="0" r="280" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="8,8" opacity="0.4" />
    <circle cx="0" cy="0" r="230" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.5" />
    <circle cx="0" cy="0" r="180" fill="none" stroke="url(#glowLine)" stroke-width="2.5" opacity="0.75" />
    <circle cx="0" cy="0" r="120" fill="#0f111a" stroke="url(#glowLine)" stroke-width="4" />
    <circle cx="0" cy="0" r="60" fill="#ffffff" opacity="0.9" />

    <!-- Sine Wave Ribbons Across Center -->
    <path d="M-400,0 Q-200,-140 0,0 T400,0" fill="none" stroke="url(#glowLine)" stroke-width="4" />
    <path d="M-400,20 Q-200,-100 0,20 T400,20" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.7" />
    <path d="M-400,-20 Q-200,-180 0,-20 T400,-20" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.7" />
  </g>

  <!-- Editorial Info Grid -->
  <g transform="translate(50, 1000)" font-family="'Space Grotesk', sans-serif" fill="#f8fafc">
    <text x="0" y="0" font-size="32" font-weight="700">EXPERIENCE THE FREQUENCY</text>
    <text x="0" y="30" font-size="14" fill="#a855f7" letter-spacing="2">360° IMMERSIVE ACOUSTIC ARCHITECTURE</text>
  </g>

  <g transform="translate(50, 1080)" font-family="'Space Grotesk', monospace" font-size="12" fill="#94a3b8">
    <text x="0" y="0">BERLIN • TOKYO • PARIS</text>
    <text x="0" y="24">CURATED BY KANI VISION STUDIO</text>
    <text x="860" y="0" text-anchor="end" fill="#06b6d4">DIM: A1 // 300 DPI</text>
    <text x="860" y="24" text-anchor="end" fill="#64748b">PRINTED ON SILK FINISH</text>
  </g>
</svg>
