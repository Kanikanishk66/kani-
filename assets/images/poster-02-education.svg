<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1200" width="100%" height="100%">
  <defs>
    <radialGradient id="eduBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#14192b" />
      <stop offset="60%" stop-color="#090d17" />
      <stop offset="100%" stop-color="#03050a" />
    </radialGradient>
    <linearGradient id="brainMesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <rect width="960" height="1200" fill="url(#eduBg)" />

  <!-- Academic Grid Layout Lines -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="1200" />
    <line x1="900" y1="0" x2="900" y2="1200" />
    <line x1="0" y1="120" x2="960" y2="120" />
    <line x1="0" y1="840" x2="960" y2="840" />
  </g>

  <!-- Header -->
  <g fill="#94a3b8" font-family="'Space Grotesk', monospace" font-size="12" letter-spacing="3">
    <text x="60" y="70">ACADEMIC SYMPOSIUM // 2026</text>
    <text x="900" y="70" text-anchor="end">SERIES 04 / LECTURE 09</text>
  </g>

  <!-- Title -->
  <g font-family="'Space Grotesk', sans-serif" font-weight="800">
    <text x="60" y="180" font-size="64" fill="#ffffff" letter-spacing="-1">CYBERNETICS &amp;</text>
    <text x="60" y="250" font-size="64" fill="#38bdf8" letter-spacing="-1">COGNITIVE HORIZONS</text>
    <text x="60" y="290" font-size="14" font-weight="500" fill="#94a3b8" letter-spacing="2">THE INTERSECTION OF NEURAL CODE AND ORGANIC CONSCIOUSNESS</text>
  </g>

  <!-- Central Visual: Neural Architecture Lattice / Geometric Cranial Wireframe -->
  <g transform="translate(480, 560)">
    <!-- Neural Node Network Polygons -->
    <polygon points="0,-180 120,-80 80,100 -80,100 -120,-80" fill="none" stroke="url(#brainMesh)" stroke-width="2" />
    <polygon points="0,-120 70,-50 50,60 -50,60 -70,-50" fill="rgba(56, 189, 248, 0.05)" stroke="#38bdf8" stroke-width="1.5" />
    
    <!-- Diagonal Lattice Connections -->
    <line x1="0" y1="-180" x2="0" y2="160" stroke="#818cf8" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="-120" y1="-80" x2="120" y2="-80" stroke="#818cf8" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="-80" y1="100" x2="80" y2="100" stroke="#818cf8" stroke-width="1" stroke-dasharray="4,4" />

    <line x1="0" y1="-180" x2="70" y2="-50" stroke="#06b6d4" stroke-width="1" />
    <line x1="0" y1="-180" x2="-70" y2="-50" stroke="#06b6d4" stroke-width="1" />
    <line x1="120" y1="-80" x2="50" y2="60" stroke="#06b6d4" stroke-width="1" />
    <line x1="-120" y1="-80" x2="-50" y2="60" stroke="#06b6d4" stroke-width="1" />

    <!-- Core Orb Glowing Node -->
    <circle cx="0" cy="0" r="30" fill="#0c101a" stroke="#38bdf8" stroke-width="2" />
    <circle cx="0" cy="0" r="10" fill="#ffffff" />

    <!-- External Synaptic Rings -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="rgba(255,255,255,0.1)" stroke-dasharray="6,8" />
  </g>

  <!-- Lecture Schedule & Details -->
  <g transform="translate(60, 920)" font-family="'Space Grotesk', monospace" font-size="12" fill="#94a3b8">
    <text x="0" y="0" font-weight="700" fill="#ffffff" letter-spacing="2">KEYNOTE SPEAKERS &amp; RESEARCH SESSIONS</text>
    <text x="0" y="30" fill="#cbd5e1">09:00 — DR. ELENA VANCE // SYNAPTIC PROTOCOLS</text>
    <text x="0" y="55" fill="#cbd5e1">11:30 — PROF. MARCUS REID // BRAIN-COMPUTER INTEGRATION</text>
    <text x="0" y="80" fill="#cbd5e1">14:00 — ROUNDTABLE: ETHICS OF ARTIFICIAL SYNTHESIS</text>

    <!-- Poster Info Column Right -->
    <text x="840" y="0" text-anchor="end" fill="#38bdf8">FREE OPEN REGISTRATION</text>
    <text x="840" y="30" text-anchor="end" fill="#64748b">AUDITORIUM B &amp; LIVE STREAM</text>
    <text x="840" y="55" text-anchor="end" fill="#64748b">ACADEMIC POSTER NO. 09-EDU</text>
  </g>

  <!-- Footer -->
  <line x1="60" y1="1120" x2="900" y2="1120" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <text x="60" y="1150" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#64748b" letter-spacing="2">DESIGNED BY KANI VISION STUDIO // EDUCATIONAL POSTER INITIATIVE</text>
</svg>
