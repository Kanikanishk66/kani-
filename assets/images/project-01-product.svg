<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="p1Bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#181a26" />
      <stop offset="50%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#06070a" />
    </radialGradient>
    <linearGradient id="anodizedChassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#383d4e" />
      <stop offset="50%" stop-color="#1e2230" />
      <stop offset="100%" stop-color="#0f1118" />
    </linearGradient>
    <linearGradient id="laserGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#64748b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#p1Bg)" />

  <!-- Studio Pedestal Shadow -->
  <ellipse cx="600" cy="580" rx="360" ry="60" fill="#000000" opacity="0.7" filter="url(#softGlow)" />
  <ellipse cx="600" cy="570" rx="280" ry="35" fill="#000000" opacity="0.9" />

  <!-- Studio Softbox Highlight Floor Reflection -->
  <ellipse cx="600" cy="590" rx="200" ry="25" fill="#8b5cf6" opacity="0.12" filter="url(#softGlow)" />

  <!-- 3D Audio Device Assembly -->
  <g transform="translate(600, 390)">
    <!-- Base Outer Housing (Beveled Hexagonal / Rounded Chassis) -->
    <path d="M-220,90 L-180,-110 C-170,-130 -150,-140 -120,-140 L120,-140 C150,-140 170,-130 180,-110 L220,90 C225,120 200,140 170,140 L-170,140 C-200,140 -225,120 -220,90 Z" 
          fill="url(#anodizedChassis)" stroke="url(#specularRim)" stroke-width="2" />

    <!-- Recessed Top Chamber -->
    <path d="M-150,-115 L150,-115 L120,40 L-120,40 Z" fill="#0b0d13" stroke="#252b3d" stroke-width="1.5" />

    <!-- Glass Core Hologram Cylinder -->
    <rect x="-100" y="-80" width="200" height="95" rx="16" fill="rgba(6, 182, 212, 0.08)" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Optical Sound Ring Elements -->
    <circle cx="0" cy="-32" r="32" fill="none" stroke="url(#laserGlow)" stroke-width="3" filter="url(#softGlow)" />
    <circle cx="0" cy="-32" r="20" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
    <circle cx="0" cy="-32" r="8" fill="#06b6d4" filter="url(#softGlow)" />

    <!-- Holographic Waveform Bars -->
    <g opacity="0.75" transform="translate(0, -32)">
      <rect x="-70" y="-12" width="4" height="24" rx="2" fill="#8b5cf6" />
      <rect x="-58" y="-18" width="4" height="36" rx="2" fill="#8b5cf6" />
      <rect x="-46" y="-8" width="4" height="16" rx="2" fill="#8b5cf6" />
      <rect x="46" y="-10" width="4" height="20" rx="2" fill="#06b6d4" />
      <rect x="58" y="-22" width="4" height="44" rx="2" fill="#06b6d4" />
      <rect x="70" y="-14" width="4" height="28" rx="2" fill="#06b6d4" />
    </g>

    <!-- Tactile Machined Knobs / Physical Rotary Controllers -->
    <g transform="translate(-140, 90)">
      <circle cx="0" cy="0" r="24" fill="#1c202d" stroke="#475569" stroke-width="2" />
      <circle cx="0" cy="0" r="18" fill="#0f121a" stroke="url(#laserGlow)" stroke-width="1.5" />
      <line x1="0" y1="-14" x2="0" y2="-4" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    </g>
    <g transform="translate(140, 90)">
      <circle cx="0" cy="0" r="24" fill="#1c202d" stroke="#475569" stroke-width="2" />
      <circle cx="0" cy="0" r="18" fill="#0f121a" stroke="url(#laserGlow)" stroke-width="1.5" />
      <line x1="10" y1="-10" x2="3" y2="-3" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Center Tactile Oled Touchstrip -->
    <rect x="-90" y="75" width="180" height="30" rx="8" fill="#090b10" stroke="#334155" stroke-width="1" />
    <text x="0" y="94" font-family="'Space Grotesk', monospace" font-size="11" fill="#38bdf8" text-anchor="middle" letter-spacing="3">192 kHz // DSD_DIRECT</text>

    <!-- Chamfer Edge Light Strip (Laser line) -->
    <path d="M-170,138 L170,138" stroke="url(#laserGlow)" stroke-width="2" filter="url(#softGlow)" />
  </g>

  <!-- Specular Chamfer Glows -->
  <line x1="420" y1="280" x2="780" y2="280" stroke="#ffffff" stroke-width="1" opacity="0.6" />

  <!-- Studio Watermark & Badges -->
  <g fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="13">
    <text x="80" y="90" fill="#f8fafc" font-weight="700" letter-spacing="1">PROJECT 01 // 3D RENDERING</text>
    <text x="80" y="112" fill="#64748b" font-size="12">HARD SURFACE CAD • PROCEDURAL SHADING</text>
    <rect x="1000" y="75" width="120" height="28" rx="6" fill="#1e2230" stroke="#3b82f6" stroke-width="1" />
    <text x="1060" y="94" fill="#60a5fa" font-size="11" text-anchor="middle" font-weight="600" letter-spacing="1">CONCEPT</text>
  </g>
</svg>
