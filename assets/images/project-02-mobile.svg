<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="uibg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#161824" />
      <stop offset="60%" stop-color="#0b0c12" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>
    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232738" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#141724" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="neonAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="phoneShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#uibg)" />

  <!-- Background UI Grid & Ambient Glows -->
  <circle cx="600" cy="400" r="280" fill="#6366f1" opacity="0.08" filter="blur(60px)" />
  <circle cx="750" cy="300" r="220" fill="#06b6d4" opacity="0.07" filter="blur(50px)" />

  <!-- Device Frame (Centered Smartphone Mockup) -->
  <g transform="translate(425, 60)" filter="url(#phoneShadow)">
    <!-- Chassis Outer Bezel -->
    <rect x="0" y="0" width="350" height="680" rx="46" fill="#181a24" stroke="url(#phoneBorder)" stroke-width="4" />
    
    <!-- Screen Glass -->
    <rect x="10" y="10" width="330" height="660" rx="38" fill="#0c0e15" />

    <!-- Speaker / Dynamic Island Notch -->
    <rect x="110" y="24" width="110" height="24" rx="12" fill="#000000" />
    <circle cx="195" cy="36" r="4.5" fill="#1e293b" />
    <circle cx="130" cy="36" r="3" fill="#06b6d4" opacity="0.6" />

    <!-- Status Bar (Time, Wifi, Battery) -->
    <text x="36" y="40" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">09:41</text>
    <g transform="translate(285, 30)" stroke="#f8fafc" stroke-width="1.5" fill="none">
      <path d="M-28,9 C-25,4 -19,4 -16,9" />
      <path d="M-26,12 C-24,8 -20,8 -18,12" />
      <rect x="-8" y="2" width="22" height="11" rx="3" stroke="#f8fafc" />
      <rect x="-6" y="4" width="14" height="7" rx="1.5" fill="#06b6d4" stroke="none" />
    </g>

    <!-- App Header -->
    <g transform="translate(24, 75)">
      <circle cx="18" cy="18" r="18" fill="#222638" stroke="#334155" stroke-width="1" />
      <text x="18" y="22" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#a855f7" text-anchor="middle">KV</text>
      <text x="46" y="15" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#64748b" letter-spacing="1">LUMINA OS</text>
      <text x="46" y="29" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Spatial Controller</text>
      <circle cx="270" cy="18" r="14" fill="#1b1e2c" stroke="#334155" stroke-width="1" />
      <path d="M266,18 L274,18 M270,14 L270,22" stroke="#94a3b8" stroke-width="1.5" />
    </g>

    <!-- Hero Card: Spatial Telemetry -->
    <g transform="translate(24, 130)">
      <rect x="0" y="0" width="282" height="150" rx="20" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="20" y="32" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#94a3b8" letter-spacing="1">ACTIVE ENVIRONMENT</text>
      <text x="20" y="60" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#ffffff">Aero-Lounge 04</text>
      
      <!-- Spatial Wave Visualizer inside Card -->
      <path d="M20,110 C50,80 80,130 110,95 C140,65 170,115 200,90 C230,70 250,95 262,85" 
            fill="none" stroke="url(#neonAccent)" stroke-width="3" stroke-linecap="round" />
      <path d="M20,110 C50,80 80,130 110,95 C140,65 170,115 200,90 C230,70 250,95 262,85 L262,130 L20,130 Z" 
            fill="url(#neonAccent)" opacity="0.08" />

      <text x="20" y="132" font-family="'Space Grotesk', monospace" font-size="10" fill="#06b6d4">48.2ms LATENCY</text>
      <text x="262" y="132" font-family="'Space Grotesk', monospace" font-size="10" fill="#a855f7" text-anchor="end">99.8% FIDELITY</text>
    </g>

    <!-- Quick Action Control Tiles (2 Column) -->
    <g transform="translate(24, 295)">
      <!-- Left Tile: Spatial Audio -->
      <rect x="0" y="0" width="134" height="110" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <circle cx="32" cy="32" r="16" fill="#1f2335" stroke="#06b6d4" stroke-width="1" />
      <path d="M27,32 L37,32 M32,27 L32,37" stroke="#06b6d4" stroke-width="1.5" />
      <text x="18" y="72" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#ffffff">Binaural 3D</text>
      <text x="18" y="90" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#64748b">Dolby Atmos On</text>

      <!-- Right Tile: Visual Dimmer -->
      <rect x="148" y="0" width="134" height="110" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <circle cx="180" cy="32" r="16" fill="#1f2335" stroke="#8b5cf6" stroke-width="1" />
      <circle cx="180" cy="32" r="6" fill="#8b5cf6" />
      <text x="166" y="72" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#ffffff">Passthrough</text>
      <text x="166" y="90" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#64748b">85% Opacity</text>
    </g>

    <!-- Volume / Haptic Slider Row -->
    <g transform="translate(24, 420)">
      <rect x="0" y="0" width="282" height="70" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <text x="18" y="28" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Haptic Immersion</text>
      <text x="264" y="28" font-family="'Space Grotesk', monospace" font-size="11" fill="#06b6d4" text-anchor="end">75%</text>
      <!-- Slider Track -->
      <rect x="18" y="42" width="246" height="8" rx="4" fill="#0b0d13" />
      <rect x="18" y="42" width="180" height="8" rx="4" fill="url(#neonAccent)" />
      <circle cx="198" cy="46" r="8" fill="#ffffff" stroke="#06b6d4" stroke-width="2" />
    </g>

    <!-- Bottom Navigation Bar -->
    <g transform="translate(24, 580)">
      <rect x="0" y="0" width="282" height="56" rx="28" fill="#161824" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <!-- Nav Icons -->
      <circle cx="45" cy="28" r="12" fill="#8b5cf6" opacity="0.25" />
      <circle cx="45" cy="28" r="4" fill="#a855f7" />
      <circle cx="115" cy="28" r="4" fill="#64748b" />
      <circle cx="170" cy="28" r="4" fill="#64748b" />
      <circle cx="235" cy="28" r="4" fill="#64748b" />
    </g>

    <!-- Home Indicator Bar -->
    <rect x="115" y="648" width="100" height="4" rx="2" fill="#94a3b8" opacity="0.6" />
  </g>

  <!-- Side Annotation Badges -->
  <g transform="translate(100, 240)">
    <rect x="0" y="0" width="240" height="90" rx="14" fill="#141724" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3,3" />
    <text x="20" y="32" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#a855f7">01 // THUMB ZONE ARCHITECTURE</text>
    <text x="20" y="55" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Interactive controls engineered for single-handed reachability.</text>
  </g>
  <line x1="340" y1="285" x2="425" y2="340" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3,3" />

  <g transform="translate(860, 420)">
    <rect x="0" y="0" width="240" height="90" rx="14" fill="#141724" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3,3" />
    <text x="20" y="32" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#06b6d4">02 // TRANSLUCENT CARDS</text>
    <text x="20" y="55" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Dark glassmorphism with subtle 1px border highlight.</text>
  </g>
  <line x1="860" y1="465" x2="775" y2="455" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3,3" />

  <!-- Studio Tag -->
  <g fill="#94a3b8" font-family="'Space Grotesk', sans-serif">
    <text x="80" y="90" fill="#f8fafc" font-size="13" font-weight="700" letter-spacing="1">PROJECT 02 // UI/UX DESIGN</text>
    <text x="80" y="112" fill="#64748b" font-size="12">SPATIAL INTERFACE • DESIGN SYSTEM • FIGMA</text>
    <rect x="1000" y="75" width="120" height="28" rx="6" fill="#1e2230" stroke="#06b6d4" stroke-width="1" />
    <text x="1060" y="94" fill="#38bdf8" font-size="11" text-anchor="middle" font-weight="600" letter-spacing="1">CONCEPT</text>
  </g>
</svg>
