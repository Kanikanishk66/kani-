<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="pavBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1c1e30" />
      <stop offset="60%" stop-color="#0a0c12" />
      <stop offset="100%" stop-color="#030406" />
    </radialGradient>
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="timberRib" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#pavBg)" />

  <!-- Dramatic Dusk Sunset Dome Background -->
  <path d="M100,500 C150,220 400,120 600,120 C800,120 1050,220 1100,500 Z" fill="url(#sunsetSky)" opacity="0.6" />

  <!-- Parametric Curved Timber Rib Arches -->
  <g fill="none" stroke="url(#timberRib)" stroke-linecap="round">
    <path d="M180,500 C220,180 500,80 600,80 C700,80 980,180 1020,500" stroke-width="14" opacity="0.95" />
    <path d="M210,500 C250,210 510,110 600,110 C690,110 950,210 990,500" stroke-width="12" opacity="0.9" />
    <path d="M240,500 C280,240 520,140 600,140 C680,140 920,240 960,500" stroke-width="10" opacity="0.85" />
    <path d="M270,500 C310,270 530,170 600,170 C670,170 890,270 930,500" stroke-width="9" opacity="0.8" />
    <path d="M300,500 C340,300 540,200 600,200 C660,200 860,300 900,500" stroke-width="8" opacity="0.75" />
    <path d="M330,500 C370,330 550,230 600,230 C650,230 830,330 870,500" stroke-width="7" opacity="0.7" />
  </g>

  <!-- Curved Insulated Glass Shell (Specular Reflections) -->
  <path d="M180,500 C220,180 500,80 600,80 C700,80 980,180 1020,500 Z" fill="rgba(56, 189, 248, 0.08)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
  <path d="M260,240 Q450,150 740,160" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.4" />

  <!-- Reflective Terrazzo / Water Pool Baseline -->
  <rect x="0" y="500" width="1200" height="300" fill="#080a0e" />
  <ellipse cx="600" cy="510" rx="460" ry="40" fill="#06b6d4" opacity="0.1" filter="blur(20px)" />
  
  <!-- Inverted Reflection of Pavilion Arches -->
  <g fill="none" stroke="url(#timberRib)" stroke-linecap="round" opacity="0.25" transform="scale(1, -0.4) translate(0, -1500)">
    <path d="M180,500 C220,180 500,80 600,80 C700,80 980,180 1020,500" stroke-width="14" />
    <path d="M240,500 C280,240 520,140 600,140 C680,140 920,240 960,500" stroke-width="10" />
    <path d="M300,500 C340,300 540,200 600,200 C660,200 860,300 900,500" stroke-width="8" />
  </g>

  <!-- Submerged LED Pathway in Pond -->
  <line x1="500" y1="510" x2="700" y2="510" stroke="#38bdf8" stroke-width="3" filter="blur(4px)" />
  <line x1="500" y1="510" x2="700" y2="510" stroke="#ffffff" stroke-width="1.5" />

  <!-- Studio Header -->
  <g fill="#94a3b8" font-family="'Space Grotesk', sans-serif">
    <text x="80" y="90" fill="#f8fafc" font-size="13" font-weight="700" letter-spacing="1">PROJECT 07 // ARCHITECTURAL PAVILION</text>
    <text x="80" y="112" fill="#64748b" font-size="12">PARAMETRIC TIMBER RIBS • SUNLIGHT STUDY • BLENDER CYCLES</text>
    <rect x="1000" y="75" width="120" height="28" rx="6" fill="#1e2230" stroke="#06b6d4" stroke-width="1" />
    <text x="1060" y="94" fill="#38bdf8" font-size="11" text-anchor="middle" font-weight="600" letter-spacing="1">CONCEPT</text>
  </g>
</svg>
