<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1200" width="100%" height="100%">
  <defs>
    <radialGradient id="posterBg" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#191528" />
      <stop offset="50%" stop-color="#0e0c15" />
      <stop offset="100%" stop-color="#050407" />
    </radialGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="chromaGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Poster Canvas -->
  <rect width="960" height="1200" fill="url(#posterBg)" />

  <!-- Outer Poster Margin & Trim Marks -->
  <g stroke="#ffffff" stroke-opacity="0.3" stroke-width="1">
    <line x1="40" y1="40" x2="60" y2="40" />
    <line x1="40" y1="40" x2="40" y2="60" />
    <line x1="920" y1="40" x2="900" y2="40" />
    <line x1="920" y1="40" x2="920" y2="60" />
    <line x1="40" y1="1160" x2="60" y2="1160" />
    <line x1="40" y1="1160" x2="40" y2="1140" />
    <line x1="920" y1="1160" x2="900" y2="1160" />
    <line x1="920" y1="1160" x2="920" y2="1140" />
    <!-- Fine Grid Lines -->
    <line x1="60" y1="200" x2="900" y2="200" stroke-opacity="0.08" stroke-dasharray="4,4" />
    <line x1="60" y1="840" x2="900" y2="840" stroke-opacity="0.08" stroke-dasharray="4,4" />
  </g>

  <!-- Top Metadata Header -->
  <g fill="#94a3b8" font-family="'Space Grotesk', monospace" font-size="12" letter-spacing="3">
    <text x="60" y="80">EDITION // 2026</text>
    <text x="480" y="80" text-anchor="middle">INTERNATIONAL AUDIO-VISUAL BIENNIAL</text>
    <text x="900" y="80" text-anchor="end">BERLIN / TOKYO / VIRTUAL</text>
  </g>

  <!-- Massive Hero Typography -->
  <g font-family="'Space Grotesk', sans-serif" font-weight="900">
    <text x="60" y="190" font-size="108" fill="#ffffff" letter-spacing="-3">RESONANCE</text>
    <text x="60" y="275" font-size="74" fill="transparent" stroke="#8b5cf6" stroke-width="2" letter-spacing="-1">LIGHT &amp; SOUND</text>
  </g>

  <!-- Procedural Harmonic Soundwave Visual Art (Vector Ribbon Sculpture) -->
  <g transform="translate(60, 310)">
    <!-- Deep Aura Glow -->
    <ellipse cx="420" cy="240" rx="360" ry="140" fill="#8b5cf6" opacity="0.16" filter="url(#chromaGlow)" />
    <ellipse cx="420" cy="240" rx="200" ry="80" fill="#06b6d4" opacity="0.14" filter="url(#chromaGlow)" />

    <!-- 16 Modulated Wave Sine Curves -->
    <path d="M0,240 Q180,60 360,240 T720,240 T840,240" fill="none" stroke="url(#waveGrad)" stroke-width="3" opacity="0.95" />
    <path d="M0,225 Q190,40 370,225 T730,225 T840,225" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.8" />
    <path d="M0,255 Q170,80 350,255 T710,255 T840,255" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.8" />
    <path d="M0,210 Q200,20 380,210 T740,210 T840,210" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.65" />
    <path d="M0,270 Q160,100 340,270 T700,270 T840,270" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.65" />
    <path d="M0,195 Q210,0 390,195 T750,195 T840,195" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.5" />
    <path d="M0,285 Q150,120 330,285 T690,285 T840,285" fill="none" stroke="#6366f1" stroke-width="1.2" opacity="0.5" />

    <path d="M0,180 Q220,-20 400,180 T760,180 T840,180" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.4" />
    <path d="M0,300 Q140,140 320,300 T680,300 T840,300" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4" />

    <!-- Vertical Acoustic Measurement Markers -->
    <line x1="210" y1="50" x2="210" y2="430" stroke="rgba(255,255,255,0.2)" stroke-dasharray="2,4" />
    <line x1="420" y1="50" x2="420" y2="430" stroke="rgba(255,255,255,0.3)" stroke-dasharray="2,4" />
    <line x1="630" y1="50" x2="630" y2="430" stroke="rgba(255,255,255,0.2)" stroke-dasharray="2,4" />
    
    <!-- Floating Spatial Sphere Core -->
    <circle cx="420" cy="240" r="54" fill="#0c0e17" stroke="url(#waveGrad)" stroke-width="3" filter="url(#chromaGlow)" />
    <circle cx="420" cy="240" r="16" fill="#ffffff" />
    <circle cx="420" cy="240" r="80" fill="none" stroke="rgba(255,255,255,0.3)" stroke-dasharray="4,6" />
  </g>

  <!-- Mid-Section Typographic Accents -->
  <g transform="translate(60, 800)" font-family="'Space Grotesk', sans-serif">
    <text x="0" y="0" font-size="28" font-weight="700" fill="#ffffff">OCTOBER 14 — 18, 2026</text>
    <text x="0" y="26" font-size="14" fill="#a855f7" letter-spacing="2">SYNTHESIS OF HARDWARE &amp; GENERATIVE LIGHT</text>
  </g>

  <!-- Bottom Info Columns (3-Column Swiss Grid) -->
  <g transform="translate(60, 880)" font-family="'Space Grotesk', monospace" font-size="12" fill="#94a3b8">
    <!-- Col 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" font-weight="700" fill="#f8fafc" letter-spacing="2">01 // ARTISTS</text>
      <text x="0" y="24" fill="#cbd5e1">KRONOS MODULAR</text>
      <text x="0" y="44" fill="#cbd5e1">SPECTRA WAVE LAB</text>
      <text x="0" y="64" fill="#cbd5e1">MONO_CHROME ARCH</text>
      <text x="0" y="84" fill="#cbd5e1">AETHER SYSTEMS</text>
    </g>
    <!-- Col 2 -->
    <g transform="translate(300, 0)">
      <text x="0" y="0" font-weight="700" fill="#f8fafc" letter-spacing="2">02 // VENUES</text>
      <text x="0" y="24" fill="#cbd5e1">KRAFTWERK MAIN HALL</text>
      <text x="0" y="44" fill="#cbd5e1">CYLINDER ACOUSTIC CAVE</text>
      <text x="0" y="64" fill="#cbd5e1">NEURAL VOID STAGE</text>
      <text x="0" y="84" fill="#cbd5e1">SPATIAL PAVILION</text>
    </g>
    <!-- Col 3: Barcode & Concept Stamp -->
    <g transform="translate(600, 0)">
      <text x="0" y="0" font-weight="700" fill="#f8fafc" letter-spacing="2">03 // CERTIFICATION</text>
      <!-- Stylized Barcode -->
      <g transform="translate(0, 18)" fill="#f8fafc">
        <rect x="0" y="0" width="3" height="42" />
        <rect x="6" y="0" width="6" height="42" />
        <rect x="16" y="0" width="2" height="42" />
        <rect x="22" y="0" width="8" height="42" />
        <rect x="34" y="0" width="3" height="42" />
        <rect x="42" y="0" width="5" height="42" />
        <rect x="52" y="0" width="10" height="42" />
        <rect x="66" y="0" width="2" height="42" />
        <rect x="72" y="0" width="4" height="42" />
        <rect x="80" y="0" width="7" height="42" />
        <rect x="92" y="0" width="3" height="42" />
        <rect x="100" y="0" width="8" height="42" />
        <rect x="112" y="0" width="2" height="42" />
        <rect x="118" y="0" width="6" height="42" />
      </g>
      <text x="0" y="80" font-size="10" letter-spacing="3" fill="#64748b">TICKET // KVS-RES-2026-X</text>
      <rect x="150" y="18" width="90" height="24" rx="4" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1" />
      <text x="195" y="34" fill="#a855f7" font-size="10" text-anchor="middle" font-weight="700">CONCEPT</text>
    </g>
  </g>

  <!-- Footer Brand Baseline -->
  <line x1="60" y1="1120" x2="900" y2="1120" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <text x="60" y="1144" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#64748b" letter-spacing="2">DESIGN BY KANI VISION STUDIO // TYPOGRAPHY &amp; 3D POSTER EXPERIMENT</text>
</svg>
