<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="socBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#241738" />
      <stop offset="50%" stop-color="#0e0b17" />
      <stop offset="100%" stop-color="#040306" />
    </radialGradient>
    <linearGradient id="spectrumRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="25%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="75%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- 1:1 Square Canvas -->
  <rect width="1000" height="1000" fill="url(#socBg)" />

  <!-- Outer Vinyl Groove Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <circle cx="500" cy="500" r="420" />
    <circle cx="500" cy="500" r="380" />
    <circle cx="500" cy="500" r="340" />
    <circle cx="500" cy="500" r="300" />
  </g>

  <!-- Center Artwork: Chromatic Glass Sound Ring -->
  <g transform="translate(500, 500)">
    <!-- Aura Glow -->
    <circle cx="0" cy="0" r="220" fill="#8b5cf6" opacity="0.2" filter="blur(40px)" />

    <!-- Outer Prismatic Glass Torus -->
    <circle cx="0" cy="0" r="200" fill="none" stroke="url(#spectrumRing)" stroke-width="38" opacity="0.9" />
    <!-- Glass Highlight Reflection -->
    <path d="M-150,-120 C-60,-190 60,-190 150,-120" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.75" />

    <!-- Inner Core Hole -->
    <circle cx="0" cy="0" r="160" fill="#08070d" stroke="#334155" stroke-width="1.5" />

    <!-- Waveform Amplitude Rays -->
    <g stroke="#06b6d4" stroke-width="2" opacity="0.8">
      <line x1="0" y1="-80" x2="0" y2="-130" stroke-width="3" stroke="#ec4899" />
      <line x1="60" y1="-60" x2="100" y2="-100" stroke-width="2" stroke="#8b5cf6" />
      <line x1="80" y1="0" x2="140" y2="0" stroke-width="3" stroke="#3b82f6" />
      <line x1="60" y1="60" x2="95" y2="95" stroke-width="2" stroke="#06b6d4" />
      <line x1="0" y1="80" x2="0" y2="120" stroke-width="3" stroke="#10b981" />
      <line x1="-60" y1="60" x2="-105" y2="105" stroke-width="2" stroke="#06b6d4" />
      <line x1="-80" y1="0" x2="-135" y2="0" stroke-width="3" stroke="#8b5cf6" />
      <line x1="-60" y1="-60" x2="-90" y2="-90" stroke-width="2" stroke="#ec4899" />
    </g>

    <!-- Center Spindle Hole / Logo -->
    <circle cx="0" cy="0" r="24" fill="#ffffff" />
    <circle cx="0" cy="0" r="8" fill="#08070d" />
  </g>

  <!-- Typography Layout for Square Social Canvas -->
  <g transform="translate(80, 100)" font-family="'Space Grotesk', sans-serif">
    <text x="0" y="0" font-size="12" font-family="'Space Grotesk', monospace" font-weight="700" fill="#a855f7" letter-spacing="4">NEW SOUND CAPSULE // EP 03</text>
    <text x="0" y="55" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">HYPER-SPACE DROP</text>
  </g>

  <g transform="translate(80, 880)" font-family="'Space Grotesk', sans-serif">
    <text x="0" y="0" font-size="18" font-weight="700" fill="#ffffff">FEATURING: VOID PROTOCOL • CHROMA PULSE • SUB-ZERO</text>
    <text x="0" y="30" font-size="12" font-family="'Space Grotesk', monospace" fill="#94a3b8" letter-spacing="2">AVAILABLE GLOBALLY ON ALL PLATFORMS // 24-BIT LOSSLESS</text>
    
    <!-- Social Share Pill -->
    <rect x="680" y="-18" width="160" height="38" rx="19" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1" />
    <text x="760" y="6" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle" letter-spacing="1">STREAM NOW ↗</text>
  </g>
</svg>
