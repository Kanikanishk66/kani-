<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Study Details | Kani Vision Studio</title>
  <meta name="description" content="Detailed case study, design process, 3D topology, and deliverables by Kani Vision Studio.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2308090d'/><polygon points='16,4 27,10 27,22 16,28 5,22 5,10' fill='none' stroke='%238b5cf6' stroke-width='2'/></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    .case-standalone-page {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #171a2b 0%, #08090d 75%);
      padding-top: 40px;
      padding-bottom: 100px;
    }
    .cs-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-heading);
      font-size: 14px;
      font-weight: 700;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      padding: 10px 20px;
      border-radius: var(--radius-pill);
      transition: all var(--trans-fast);
    }
    .btn-back:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent-cyan);
      transform: translateX(-4px);
    }
    .palette-swatches {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }
    .palette-box {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>
  <div class="case-standalone-page">
    <div class="container">
      <!-- Top Navigation -->
      <div class="cs-top-bar">
        <a href="index.html" class="btn-back">
          <span>← Back to Studio</span>
        </a>
        <div style="display: flex; gap: 12px;">
          <a href="viewer-3d.html" target="_blank" rel="noopener noreferrer" class="btn-secondary" style="font-size: 13px; padding: 10px 20px;">
            <span>Open 3D Studio ↗</span>
          </a>
          <a href="index.html#contact" class="btn-primary" style="font-size: 13px; padding: 10px 22px;">
            <span>Commission Project →</span>
          </a>
        </div>
      </div>

      <!-- Case Study Content -->
      <div id="cs-content-mount">
        <!-- Rendered dynamically from projects-data.js by id in query param -->
      </div>
    </div>
  </div>

  <script type="module">
    import { projectsData } from "./js/projects-data.js";

    function loadCaseStudy() {
      const params = new URLSearchParams(window.location.search);
      const projectId = params.get('id') || 'project-01';
      const project = projectsData.find(p => p.id === projectId) || projectsData[0];
      const projectIndex = projectsData.findIndex(p => p.id === project.id);
      const nextProject = projectsData[(projectIndex + 1) % projectsData.length];

      document.title = `${project.title} — Case Study | Kani Vision Studio`;

      const mount = document.getElementById('cs-content-mount');
      mount.innerHTML = `
        <div class="cs-header">
          <div class="cs-badges-row">
            <span class="badge badge-accent">${project.categoryLabel || project.category}</span>
            <span class="badge badge-outline">${project.projectType}</span>
            <span style="font-family: var(--font-mono); font-size: 12px; color: var(--text-muted);">${project.year}</span>
            <span class="badge" style="background: rgba(6, 182, 212, 0.15); color: #38bdf8; border: 1px solid #06b6d4;">STANDALONE TAB ↗</span>
          </div>
          <h1 class="cs-title" style="font-size: clamp(38px, 6vw, 70px);">${project.title}</h1>
          <p class="cs-idea-lead" style="color: var(--text-secondary); margin-bottom: 24px;">${project.shortDesc}</p>
        </div>

        <div class="cs-hero-frame" style="box-shadow: 0 0 50px rgba(139, 92, 246, 0.25);">
          <img src="${project.heroImage}" alt="${project.title}" />
        </div>

        <!-- THE IDEA -->
        <div class="cs-section-block">
          <div class="cs-block-label">01 // THE IDEA &amp; VISION</div>
          <p class="cs-idea-lead">${project.concept.theIdea}</p>
        </div>

        <!-- THE PROCESS -->
        <div class="cs-section-block">
          <div class="cs-block-label">02 // 5-PHASE EXECUTION PROCESS</div>
          <div class="cs-process-steps-list">
            ${project.concept.processSteps.map(step => `
              <div class="cs-step-card" style="border-left: 3px solid var(--accent-violet);">
                <span class="cs-step-phase">${step.phase}</span>
                <p class="cs-step-desc">${step.desc}</p>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- SPECS ROW -->
        <div class="cs-specs-row">
          <div>
            <div class="cs-block-label">03 // TOOLS &amp; SOFTWARE</div>
            <div class="cs-chips-wrap">
              ${project.concept.tools.map(tool => `<span class="cs-tool-chip">${tool}</span>`).join('')}
            </div>
          </div>
          <div>
            <div class="cs-block-label">04 // DELIVERABLES CREATED</div>
            <ul class="cs-deliv-list">
              ${project.concept.deliverables.map(deliv => `<li class="cs-deliv-item"><span class="check" style="color: var(--accent-cyan); font-weight: bold;">✓</span> <span>${deliv}</span></li>`).join('')}
            </ul>
          </div>
        </div>

        <!-- GALLERY -->
        <div class="cs-section-block">
          <div class="cs-block-label">05 // FINAL RESULT &amp; MULTI-ANGLE GALLERY</div>
          <div class="cs-gallery-grid">
            ${project.concept.gallery.map(item => `
              <div class="cs-gallery-card">
                <div class="cs-gal-img-wrap">
                  <img src="${item.image}" alt="${item.title}" loading="lazy" />
                </div>
                <div class="cs-gal-caption">
                  <strong>${item.title}</strong>
                  <span>${item.caption}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- NEXT PROJECT -->
        <div class="cs-next-wrap" style="display: flex; justify-content: space-between; align-items: center;">
          <a href="index.html#work" class="btn-secondary">
            <span>← All Selected Work</span>
          </a>
          <a href="project.html?id=${nextProject.id}" class="cs-next-btn" style="text-decoration: none;">
            <div class="next-label">Next Project</div>
            <div class="next-title">${nextProject.title} →</div>
          </a>
        </div>
      `;
    }

    window.addEventListener('DOMContentLoaded', loadCaseStudy);
  </script>
</body>
</html>
